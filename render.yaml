services:
  - type: web
    name: fit-thetic-sync-server
    env: node
    plan: free
    buildCommand: npm install --omit=dev --ignore-scripts
    startCommand: node server/index.js
    envVars:
      - key: PORT
        value: 5000
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
      - key: CORS_ORIGIN
        value: "*"
